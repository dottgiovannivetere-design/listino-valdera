<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123d2f">
  <link rel="manifest" href="manifest.json">
  <title>VALDERA D.B. - Listino</title>

  <style>
    :root {
      --brand:#123d2f; --brand2:#1d5d48; --bg:#f3f6f4; --card:#fff;
      --ink:#18221d; --muted:#68756f; --line:#dfe7e2; --danger:#922f3b;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:var(--bg); color:var(--ink); }
    header { background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; padding:18px 16px; position:sticky; top:0; z-index:10; }
    header h1 { margin:0; font-size:20px; }
    header p { margin:4px 0 0; font-size:13px; opacity:.9; }
    main { max-width:1050px; margin:auto; padding:14px; }
    .card { background:var(--card); border-radius:15px; padding:14px; margin-bottom:12px; box-shadow:0 2px 14px rgba(0,0,0,.06); }
    .grid { display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:8px; }
    input,select,button { font:inherit; padding:11px; border-radius:10px; border:1px solid var(--line); }
    button { background:var(--brand); color:#fff; border:0; font-weight:700; cursor:pointer; }
    button.alt { background:#4c5c55; }
    button.danger { background:var(--danger); }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; }
    .toolbar input { flex:1; min-width:220px; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:10px 6px; border-bottom:1px solid var(--line); text-align:left; font-size:14px; vertical-align:top; }
    th.price,td.price { text-align:right; white-space:nowrap; }
    .badge { display:inline-block; padding:3px 7px; border-radius:999px; background:#e8f0ec; font-size:11px; }
    .muted { color:var(--muted); font-size:12px; }
    .selected { background:#f0f7f3; }
    .pill { display:inline-block; padding:5px 9px; background:#e8f0ec; border-radius:999px; margin:3px; font-size:12px; }
    @media(max-width:720px) {
      .grid { grid-template-columns:1fr 1fr; }
      .grid input:first-child { grid-column:1/-1; }
      th.cat,td.cat { display:none; }
      th.actions,td.actions { min-width:135px; }
    }
  </style>
</head>
<body>
<header>
  <h1>VALDERA D.B. s.n.c.</h1>
  <p>LISTINO PRODOTTI</p>
</header>

<main>
  <div class="card">
    <div class="grid">
      <input id="product" placeholder="Nuovo prodotto">
      <input id="price" placeholder="Prezzo" inputmode="decimal">
      <select id="category"></select>
      <button id="addBtn">Aggiungi</button>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <input id="search" placeholder="Cerca prodotto (es. gin, Bombay, Aperol)" autocomplete="off">
      <button type="button" id="searchBtn">Cerca</button>
      <select id="filter"></select>
      <button id="pdfBtn">Genera PDF</button>
      <button class="alt" id="exportBtn">Esporta dati</button>
      <label class="alt" style="padding:11px;border-radius:10px;color:white;cursor:pointer">
        Importa
        <input id="importFile" type="file" accept=".json" hidden>
      </label>
      <button class="danger" id="resetBtn">Ripristina</button>
    </div>
    <p class="muted" id="count"></p>
  </div>

  <div class="card">
    <strong>Prodotti selezionati per il PDF</strong>
    <div id="selectedList" class="muted" style="margin-top:8px">Nessun prodotto selezionato.</div>
  </div>

  <div class="card" style="overflow:auto">
    <table>
      <thead>
        <tr>
          <th>Prodotto</th>
          <th class="cat">Categoria</th>
          <th class="price">Prezzo</th>
          <th class="actions">Azioni</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

  const $ = id => document.getElementById(id);

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function normalizePrice(v) {
    return (v || "").replace("€","").trim().replace(".",",");
  }

  function getCategories() {
    return [...new Set(items.map(x => x.category))].sort();
  }

  function fillSelects() {
    const cats = getCategories();
    $("category").innerHTML = cats.map(c => `<option>${c}</option>`).join("");
    $("filter").innerHTML = '<option value="">Tutte le categorie</option>' +
      cats.map(c => `<option>${c}</option>`).join("");
  }

  function renderSelected() {
    if (!selected.length) {
      $("selectedList").textContent = "Nessun prodotto selezionato.";
      return;
    }
    $("selectedList").innerHTML = selected.map((x,i) =>
      `<span class="pill">${x.product} — ${x.tempPrice || x.price}
       <button class="danger" style="padding:3px 6px;margin-left:5px" onclick="removeSelected(${i})">×</button></span>`
    ).join("");
  }

  function normalizeSearch(value) {
    return (value || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[’']/g, "")
      .trim();
  }

  function render() {
    const q = normalizeSearch($("search").value);
    const f = $("filter").value;
    const shown = items.map((x,i) => ({...x, i})).filter(x => {
      const searchable = normalizeSearch(`${x.product} ${x.category}`);
      return (!f || x.category === f) && (!q || searchable.includes(q));
    });

    $("rows").innerHTML = shown.map(x => `
      <tr>
        <td>${x.product}</td>
        <td class="cat"><span class="badge">${x.category}</span></td>
        <td class="price">${x.price}</td>
        <td class="actions">
          <button onclick="selectItem(${x.i})">PDF</button>
          <button class="alt" onclick="editItem(${x.i})">Modifica</button>
          <button class="danger" onclick="deleteItem(${x.i})">Elimina</button>
        </td>
      </tr>`).join("");

    $("count").textContent = `${shown.length} prodotti visualizzati su ${items.length}`;
  }

  function addItem() {
    const product = $("product").value.trim();
    const price = normalizePrice($("price").value);
    const category = $("category").value || "Altri";
    if (!product || !price) return alert("Inserisci prodotto e prezzo");
    items.push({category, product, price});
    save();
    $("product").value = "";
    $("price").value = "";
    fillSelects();
    render();
  }

  window.selectItem = i => {
    const base = items[i];
    const temp = prompt("Prezzo per questo PDF (lascia invariato oppure modifica):", base.price);
    if (temp === null) return;
    selected.push({...base, tempPrice: normalizePrice(temp)});
    renderSelected();
  };

  window.removeSelected = i => {
    selected.splice(i,1);
    renderSelected();
  };

  window.editItem = i => {
    const p = prompt("Prodotto", items[i].product); if (p === null) return;
    const pr = prompt("Prezzo", items[i].price); if (pr === null) return;
    const c = prompt("Categoria", items[i].category); if (c === null) return;
    items[i] = {
      product: p.trim(),
      price: normalizePrice(pr),
      category: c.trim() || "Altri"
    };
    save();
    fillSelects();
    render();
  };

  window.deleteItem = i => {
    if (confirm("Eliminare questo prodotto?")) {
      items.splice(i,1);
      save();
      fillSelects();
      render();
    }
  };

  function makePdf() {
    const list = selected.length ? selected : items.filter(x => {
      const f = $("filter").value;
      const q = $("search").value.toLowerCase().trim();
      return (!f || x.category === f) &&
             (!q || x.product.toLowerCase().includes(q) || x.category.toLowerCase().includes(q));
    });

    if (!list.length) return alert("Nessun prodotto da inserire");

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:"pt", format:"a4" });
    const marginX = 38;
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    let y = 48;

    function header() {
      pdf.setFont("helvetica","bold");
      pdf.setFontSize(16);
      pdf.text("VALDERA D.B. s.n.c.", marginX, y);
      y += 20;
      pdf.text("LISTINO PRODOTTI", marginX, y);
      y += 28;
    }

    header();
    let lastCategory = "";

    const sorted = [...list].sort((a,b) =>
      a.category.localeCompare(b.category) || a.product.localeCompare(b.product)
    );

    for (const r of sorted) {
      if (y > pageH - 55) {
        pdf.addPage();
        y = 48;
        header();
        lastCategory = "";
      }

      if (r.category !== lastCategory) {
        pdf.setFont("helvetica","bold");
        pdf.setFontSize(12);
        pdf.text(r.category, marginX, y);
        y += 18;
        lastCategory = r.category;
      }

      pdf.setFont("helvetica","normal");
      pdf.setFontSize(10);
      const lines = pdf.splitTextToSize(r.product, pageW - 150);
      pdf.text(lines, marginX, y);
      pdf.text(r.tempPrice || r.price, pageW - marginX, y, {align:"right"});
      y += Math.max(16, lines.length * 13) + 3;
      pdf.setDrawColor(225);
      pdf.line(marginX, y - 6, pageW - marginX, y - 6);
    }

    const blob = pdf.output("blob");
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank");
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(items,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "valdera_prodotti_backup.json";
    a.click();
  }

  $("importFile").addEventListener("change", async e => {
    try {
      const txt = await e.target.files[0].text();
      const imported = JSON.parse(txt);
      if (!Array.isArray(imported)) throw new Error();
      items = imported;
      save();
      fillSelects();
      render();
      alert("Dati importati");
    } catch {
      alert("File non valido");
    }
  });

  $("addBtn").onclick = addItem;
  $("pdfBtn").onclick = makePdf;
  $("exportBtn").onclick = exportData;
  $("resetBtn").onclick = () => {
    if (confirm("Ripristinare il listino iniziale?")) {
      items = DEFAULT_DATA.map(x => ({...x}));
      selected = [];
      save();
      fillSelects();
      render();
      renderSelected();
    }
  };

  const searchBox = $("search");
  ["input", "keyup", "change", "search"].forEach(eventName => {
    searchBox.addEventListener(eventName, render);
  });
  $("searchBtn").addEventListener("click", render);
  $("filter").addEventListener("change", render);

  fillSelects();
  render();
  renderSelected();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
  }
</script>
</body>
</html>
