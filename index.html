  <style>
    :root {
      --brand:#123d2f; --brand2:#1e654d; --bg:#f3f6f4; --card:#fff;
      --ink:#18221d; --muted:#66736d; --line:#dce5e0; --danger:#963442;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:var(--bg); color:var(--ink); }
    header { position:sticky; top:0; z-index:10; padding:17px 15px; color:#fff;
              background:linear-gradient(135deg,var(--brand),var(--brand2)); }
    header h1 { margin:0; font-size:20px; }
    header p { margin:4px 0 0; font-size:13px; opacity:.9; }
    main { max-width:1050px; margin:auto; padding:13px; }
    .card { background:var(--card); border-radius:15px; padding:14px; margin-bottom:12px;
             box-shadow:0 2px 13px rgba(0,0,0,.06); }
    input, select, button { font:inherit; border-radius:10px; padding:11px; border:1px solid var(--line); }
    button { border:0; background:var(--brand); color:#fff; font-weight:700; cursor:pointer; }
    button.alt { background:#506059; }
    button.danger { background:var(--danger); }
    button.small { padding:7px 9px; font-size:12px; }
    .searchRow { display:grid; grid-template-columns:1fr auto; gap:8px; }
    .searchRow input { width:100%; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
    .filters select { flex:1; min-width:190px; }
    .muted { color:var(--muted); font-size:12px; }
    .results { margin-top:10px; max-height:390px; overflow:auto; border-top:1px solid var(--line); }
    .result { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center;
               padding:11px 2px; border-bottom:1px solid var(--line); }
    .result strong { display:block; font-size:14px; }
    .result span { font-size:12px; color:var(--muted); }
    .price { white-space:nowrap; font-weight:700; }
    .editor { display:grid; grid-template-columns:2fr 1fr .7fr auto; gap:8px; margin-top:12px; }
    .editor input { width:100%; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:9px 5px; border-bottom:1px solid var(--line); text-align:left; font-size:13px; vertical-align:middle; }
    th.num,td.num { text-align:right; white-space:nowrap; }
    .total { display:flex; justify-content:space-between; align-items:center; font-size:18px; font-weight:700; margin-top:12px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-top:11px; }
    .manageGrid { display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:8px; }
    .badge { display:inline-block; padding:3px 7px; border-radius:999px; background:#e8f0ec; font-size:11px; }
    @media(max-width:720px) {
      .editor { grid-template-columns:1fr 1fr; }
      .editor input:first-child { grid-column:1/-1; }
      .manageGrid { grid-template-columns:1fr 1fr; }
      .manageGrid input:first-child { grid-column:1/-1; }
      th.category,td.category { display:none; }
      .result { grid-template-columns:1fr auto; }
    }
  </style>
</head>

<header>
  <h1>VALDERA D.B. s.n.c.</h1>
  <p>LISTINO PRODOTTI</p>
</header>

<main>
  <section class="card">
    <div class="searchRow">
      <input id="search" autocomplete="off" placeholder="Cerca: birra, Bombay, Aperol, Coca...">
      <button type="button" id="clearSearch">Pulisci</button>
    </div>
    <div class="filters">
      <select id="categoryFilter"></select>
    </div>
    <p id="resultCount" class="muted"></p>
    <div id="results" class="results"></div>
  </section>

  <section class="card">
    <strong>Prodotto da aggiungere al PDF</strong>
    <div class="editor">
      <input id="chosenProduct" placeholder="Seleziona un prodotto dai risultati">
      <input id="chosenPrice" placeholder="Prezzo" inputmode="decimal">
      <input id="chosenQty" type="number" min="1" step="1" value="1" placeholder="Quantità">
      <button type="button" id="addToPdf">Aggiungi al PDF</button>
    </div>
    <p class="muted">Il prezzo qui può essere modificato solo per il PDF, senza cambiare il prezzo dell'archivio.</p>
  </section>

  <section class="card" style="overflow:auto">
    <strong>Prodotti selezionati</strong>
    <table>
      <thead>
        <tr><th>Prodotto</th><th class="num">Prezzo</th><th class="num">Qtà</th><th class="num">Totale</th><th></th></tr>
      </thead>
      <tbody id="cartRows"></tbody>
    </table>
    <div class="total"><span>Totale</span><span id="grandTotal">0,00</span></div>
    <div class="toolbar">
      <button type="button" id="makePdf">Genera PDF</button>
      <button type="button" class="danger" id="clearCart">Svuota selezione</button>
    </div>
  </section>

  <section class="card">
    <strong>Gestione archivio</strong>
    <div class="manageGrid" style="margin-top:10px">
      <input id="newProduct" placeholder="Nome prodotto">
      <input id="newPrice" placeholder="Prezzo" inputmode="decimal">
      <select id="newCategory"></select>
      <button type="button" id="addProduct">Nuovo prodotto</button>
    </div>
    <div class="toolbar">
      <button type="button" class="alt" id="exportData">Esporta backup</button>
      <label class="alt" style="padding:11px;border-radius:10px;color:#fff;cursor:pointer">
        Importa backup<input id="importData" type="file" accept=".json" hidden>
      </label>
      <button type="button" class="danger" id="resetData">Ripristina archivio iniziale</button>
    </div>
  </section>
</main>

  function saveCart() {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }

  function categories() {
    return [...new Set(products.map(x => x.category))].sort((a,b) => a.localeCompare(b));
  }

  function fillCategories() {
    const cats = categories();
    $("categoryFilter").innerHTML =
      '<option value="">Tutte le categorie</option>' +
      cats.map(c => `<option value="${c}">${c}</option>`).join("");
    $("newCategory").innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join("");
  }

  function filteredProducts() {
    const query = normalizeText($("search").value);
    const category = $("categoryFilter").value;
    return products.map((p,index) => ({...p,index})).filter(p => {
      const haystack = normalizeText(`${p.product} ${p.category}`);
      return (!category || p.category === category) && (!query || haystack.includes(query));
    });
  }

  function renderResults() {
    const list = filteredProducts();
    $("resultCount").textContent = `${list.length} risultati su ${products.length} prodotti`;
    $("results").innerHTML = list.map(p => `
      <div class="result">
        <div>
          <strong>${p.product}</strong>
          <span>${p.category}</span>
        </div>
        <div>
          <span class="price">${p.price}</span>
          <button type="button" class="small" onclick="chooseProduct(${p.index})">Seleziona</button>
          <button type="button" class="small alt" onclick="editProduct(${p.index})">Modifica</button>
        </div>
      </div>
    `).join("");
  }

  window.chooseProduct = index => {
    const p = products[index];
    chosenIndex = index;
    $("chosenProduct").value = p.product;
    $("chosenPrice").value = p.price;
    $("chosenQty").value = 1;
    $("chosenPrice").focus();
  };

  window.editProduct = index => {
    const current = products[index];
    const name = prompt("Nome prodotto", current.product);
    if (name === null) return;
    const price = prompt("Prezzo definitivo", current.price);
    if (price === null) return;
    const category = prompt("Categoria", current.category);
    if (category === null) return;
    const normalized = normalizePrice(price);
    if (!name.trim() || !normalized) return alert("Dati non validi");
    products[index] = {
      product:name.trim(),
      price:normalized,
      category:category.trim() || "Altri"
    };
    saveProducts();
    fillCategories();
    renderResults();
  };

  function addChosenToPdf() {
    const product = $("chosenProduct").value.trim();
    const price = normalizePrice($("chosenPrice").value);
    const quantity = Math.max(1, parseInt($("chosenQty").value || "1", 10));
    if (!product || !price) return alert("Seleziona un prodotto e controlla il prezzo");
    const category = chosenIndex !== null && products[chosenIndex]
      ? products[chosenIndex].category : "Altri";
    cart.push({product, price, quantity, category});
    saveCart();
    renderCart();
    $("chosenProduct").value = "";
    $("chosenPrice").value = "";
    $("chosenQty").value = 1;
    chosenIndex = null;
  }

  function renderCart() {
    $("cartRows").innerHTML = cart.map((item,index) => {
      const total = priceNumber(item.price) * Number(item.quantity || 1);
      return `<tr>
        <td>${item.product}</td>
        <td class="num">${item.price}</td>
        <td class="num">
          <input style="width:64px;padding:6px" type="number" min="1" value="${item.quantity}"
                 onchange="changeQty(${index},this.value)">
        </td>
        <td class="num">${money(total)}</td>
        <td><button type="button" class="small danger" onclick="removeCart(${index})">Elimina</button></td>
      </tr>`;
    }).join("");
    const total = cart.reduce((sum,item) =>
      sum + priceNumber(item.price) * Number(item.quantity || 1), 0);
    $("grandTotal").textContent = money(total);
  }

  window.changeQty = (index,value) => {
    cart[index].quantity = Math.max(1, parseInt(value || "1",10));
    saveCart();
    renderCart();
  };

  window.removeCart = index => {
    cart.splice(index,1);
    saveCart();
    renderCart();
  };

  function generatePdf() {
    if (!cart.length) return alert("Non hai aggiunto prodotti al PDF");
    if (!window.jspdf || !window.jspdf.jsPDF) return alert("Libreria PDF non caricata. Controlla la connessione.");

    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({unit:"pt",format:"a4"});
    const margin = 40;
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    let y = 52;

    function header() {
      pdf.setFont("helvetica","bold");
      pdf.setFontSize(16);
      pdf.text("VALDERA D.B. s.n.c.", margin, y);
      y += 20;
      pdf.text("LISTINO PRODOTTI", margin, y);
      y += 26;
      pdf.setFontSize(9);
      pdf.setFont("helvetica","normal");
      pdf.text(new Date().toLocaleDateString("it-IT"), pageW - margin, y - 20, {align:"right"});
      pdf.setFont("helvetica","bold");
      pdf.text("Prodotto", margin, y);
      pdf.text("Prezzo", pageW - 150, y, {align:"right"});
      pdf.text("Qtà", pageW - 95, y, {align:"right"});
      pdf.text("Totale", pageW - margin, y, {align:"right"});
      pdf.line(margin, y + 5, pageW - margin, y + 5);
      y += 20;
    }

    header();
    pdf.setFont("helvetica","normal");
    pdf.setFontSize(10);

    for (const item of cart) {
      const total = priceNumber(item.price) * Number(item.quantity || 1);
      const lines = pdf.splitTextToSize(item.product, pageW - 250);
      const needed = Math.max(18, lines.length * 13 + 5);
      if (y + needed > pageH - 70) {
        pdf.addPage();
        y = 52;
        header();
        pdf.setFont("helvetica","normal");
        pdf.setFontSize(10);
      }
      pdf.text(lines, margin, y);
      pdf.text(item.price, pageW - 150, y, {align:"right"});
      pdf.text(String(item.quantity), pageW - 95, y, {align:"right"});
      pdf.text(money(total), pageW - margin, y, {align:"right"});
      y += needed;
      pdf.setDrawColor(225);
      pdf.line(margin, y - 7, pageW - margin, y - 7);
    }

    const grand = cart.reduce((sum,item) =>
      sum + priceNumber(item.price) * Number(item.quantity || 1), 0);
    if (y > pageH - 70) {
      pdf.addPage();
      y = 52;
    }
    pdf.setFont("helvetica","bold");
    pdf.setFontSize(12);
    pdf.text("TOTALE", pageW - 150, y + 12, {align:"right"});
    pdf.text(money(grand), pageW - margin, y + 12, {align:"right"});

    const blob = pdf.output("blob");
    const url = URL.createObjectURL(blob);
    const opened = window.open(url, "_blank");
    if (!opened) {
      const a = document.createElement("a");
      a.href = url;
      a.download = "Listino_VALDERA_DB.pdf";
      a.click();
    }
  }

  function addNewProduct() {
    const product = $("newProduct").value.trim();
    const price = normalizePrice($("newPrice").value);
    const category = $("newCategory").value || "Altri";
    if (!product || !price) return alert("Inserisci nome e prezzo");
    products.push({product,price,category});
    saveProducts();
    fillCategories();
    renderResults();
    $("newProduct").value = "";
    $("newPrice").value = "";
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify(products,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "valdera_backup_prodotti.json";
    a.click();
  }

  $("importData").addEventListener("change", async event => {
    try {
      const data = JSON.parse(await event.target.files[0].text());
      if (!Array.isArray(data)) throw new Error();
      products = data;
      saveProducts();
      fillCategories();
      renderResults();
      alert("Backup importato");
    } catch {
      alert("File di backup non valido");
    }
  });

  $("search").addEventListener("input", renderResults);
  $("search").addEventListener("keyup", renderResults);
  $("search").addEventListener("change", renderResults);
  $("categoryFilter").addEventListener("change", renderResults);
  $("clearSearch").onclick = () => {
    $("search").value = "";
    $("categoryFilter").value = "";
    renderResults();
  };
  $("addToPdf").onclick = addChosenToPdf;
  $("makePdf").onclick = generatePdf;
  $("clearCart").onclick = () => {
    if (confirm("Svuotare tutti i prodotti selezionati?")) {
      cart = [];
      saveCart();
      renderCart();
    }
  };
  $("addProduct").onclick = addNewProduct;
  $("exportData").onclick = exportBackup;
  $("resetData").onclick = () => {
    if (confirm("Ripristinare tutti i prodotti iniziali?")) {
      products = DEFAULT_PRODUCTS.map(x => ({...x}));
      saveProducts();
      fillCategories();
      renderResults();
    }
  };

  fillCategories();
  renderResults();
  renderCart();
</script>
</body>
</html>
